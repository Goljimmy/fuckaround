<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Grand Line Simulator</title><style>
:root{color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#050b14;color:#edf5ff;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.app{max-width:1200px;margin:auto;padding:14px 16px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.top{margin-bottom:12px;flex-wrap:wrap}.brand{display:flex;gap:10px;align-items:center}.logo{font-size:28px;background:#ffd166;color:#07111f;padding:8px;border-radius:13px}.title{font-size:20px;font-weight:900}.muted{color:#8fa6bd;font-size:12px}.hero,.panel{background:linear-gradient(180deg,#0e1b2d,#091321);border:1px solid #29435e;border-radius:16px;box-shadow:0 10px 30px #0006}.hero{padding:20px;margin-bottom:12px}.hero h1{margin:0 0 5px;text-wrap:balance}.hero p{color:#a8bdd2;line-height:1.6}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge,.tag{background:#0a1726;border:1px solid #29445f;border-radius:99px;padding:6px 9px;font-size:11px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.panel{padding:13px;margin-bottom:12px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.btn{background:#102139;color:#edf5ff;border:1px solid #29435e;border-radius:9px;padding:8px 11px;cursor:pointer}.btn:hover{border-color:#668db2}.btn:focus-visible{outline:2px solid #ffd166;outline-offset:2px}.primary{background:#ffd166;color:#07111f;border:0;font-weight:800}.danger{color:#ff9ca7}.active{border-color:#ffd166;color:#ffd166}.hidden{display:none}.stats,.cards,.map{display:grid;gap:8px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.map{grid-template-columns:repeat(5,minmax(0,1fr))}.card,.island{background:#081421;border:1px solid #27425c;border-radius:12px;padding:10px}.island{min-height:85px;cursor:pointer;display:flex;flex-direction:column;gap:3px}.island.lock{opacity:.35;cursor:not-allowed}.island.sel{border-color:#ffd166;box-shadow:0 0 0 1px #ffd16655}.card.click{cursor:pointer}.card.sel{border-color:#ffd166}.icon{font-size:27px}.stat small{color:#8fa6bd}.card b{font-size:18px;display:block;margin-top:3px}.bar,.hp{height:8px;background:#1b2a3d;border-radius:99px;overflow:hidden;margin-top:6px}.bar i,.hp i{display:block;height:100%;background:#55c8ff}.hp i{background:#ff6472}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.log{height:210px;overflow:auto;background:#050b12;border:1px solid #1c3147;border-radius:10px;padding:9px;line-height:1.65;font-size:12px}.good{color:#54dc91}.warn{color:#ffd166}.bad{color:#ff7c89}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.modal.open{display:flex}.box{width:min(720px,100%);max-height:90vh;overflow:auto;background:#0c192a;border:1px solid #385675;border-radius:16px;padding:18px}.story{font-size:15px;line-height:1.8}.boss{border-color:#b75cff;background:#170e25}@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}.map{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:minmax(0,1fr)}.title{font-size:16px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">☠️</div><div><div class="title">Grand Line Simulator · V2</div><div class="muted">GRAND LINE RPG · STORY EDITION</div></div></div><div class="actions"><button class="btn" onclick="save(true)">💾 Save</button><button class="btn" onclick="resetGame()">↻ Reset</button></div></header>
<section class="hero"><h1>Set Sail for the Final Island</h1><p>Explore, fight, make allies and grow stronger. Your choices shape your faction reputation, your crew bonds and your ending.</p><div class="badges"><span class="badge">⭐ Lv.<b id="lv"></b></span><span class="badge">💰 <b id="berry"></b></span><span class="badge">☠️ Bounty <b id="bounty"></b></span><span class="badge">📖 Chapter <b id="chapter"></b></span><span class="badge">📍 <b id="place"></b></span></div></section>
<div class="grid"><main><section class="panel"><div class="tabs"><button class="btn active" onclick="tab('adventure',this)">🗺️ Adventure</button><button class="btn" onclick="tab('story',this)">📖 Story</button><button class="btn" onclick="tab('crew',this)">👒 Crew</button><button class="btn" onclick="tab('growth',this)">🌳 Growth</button><button class="btn" onclick="tab('shop',this)">🏪 Shop</button><button class="btn" onclick="tab('faction',this)">⚓ Factions</button></div><div id="adventure"></div><div id="story" class="hidden"></div><div id="crew" class="hidden"></div><div id="growth" class="hidden"></div><div id="shop" class="hidden"></div><div id="faction" class="hidden"></div></section><section class="panel"><h2>Active Crew</h2><div id="team" class="cards"></div></section></main><aside><section class="panel"><h2>Current Area</h2><div id="area"></div></section><section class="panel"><h2>Battle</h2><div id="battle"></div></section><section class="panel"><h2>Ship’s Log</h2><div id="log" class="log"></div></section></aside></div></div><div id="modal" class="modal"><div class="box"><h2 id="mt"></h2><div id="mb"></div><button class="btn" onclick="closeModal()">Close</button></div></div>
<script>
const islands=[['East Blue Gateway','🌊',1,120],['Whisky Peak','🏜️',2,220],['Little Garden','🌴',3,330],['Alabasta','🏛️',5,600],['Skypiea','☁️',7,850],['Water 7','🚂',9,1200],['Sabaody Archipelago','🌳',12,1700],['Fish-Man Island','🐟',15,2400],['Wano Country','⛩️',18,3400],['Final Island','🏴‍☠️',25,9000]];
const chars=[['Luffy','👒','Captain',28,13,110,8,'Gum-Gum Gatling'],['Zoro','⚔️','Swordsman',31,18,105,5,'Three-Sword Style: Oni Giri'],['Nami','🍊','Navigator',15,10,90,25,'Zeus Thundercloud'],['Sanji','🦵','Cook',25,17,105,9,'Diable Jambe'],['Usopp','🎯','Sniper',21,11,95,12,'Fire Bird Star'],['Robin','🌸','Archaeologist',22,13,95,15,'Cien Fleur']];
const chapters=[['Setting Sail','East Blue Gateway','A band of young pirates sails into the Grand Line.','Trust your crew and begin your voyage.'],['Night of the Bounty Hunters','Whisky Peak','The island’s warm welcome hides a trap.','Defeat the attackers and protect your crew.'],['Island of Giants','Little Garden','Legends of ancient giants and dinosaurs awaken.','Explore the ruins and find clues to history.'],['Kingdom of Sand','Alabasta','A kingdom is being torn apart by a conspiracy.','Decide whether to save the kingdom or chase the bounty.'],['Land of God','Skypiea','Legends of gold and thunder drift through the sky.','Uncover the secret of the Golden Bell.'],['City of Water','Water 7','The shadow of the World Government draws closer.','Protect your friends and break through the blockade.'],['Land of the Celestial Dragons','Sabaody Archipelago','At the gate to the New World, the tide of an era crashes in.','Sail quietly, or declare war openly.'],['Kingdom Under the Sea','Fish-Man Island','A kingdom beneath the waves awaits a new choice.','Resolve the conflict between the races.'],['Land of Samurai','Wano Country','A colossal enemy rules a closed-off nation.','Gather your forces and start the great battle.'],['Final Island','Final Island','The world’s greatest secret lies just ahead.','Make your decision and face your ending.']];
const enemies=[['Pirate Hunter',18,9,65,70],['Marine Commander',25,15,90,120],['Baroque Works Agent',31,18,115,180],['CP Agent',40,24,145,300],['New World Pirate',50,30,180,480],['Haki Master',64,39,230,800],['Emperor’s Commander',82,50,300,1400]];
const bosses=[['Sir Crocodile','🐊',75,43,360,1600],['Black-Leg Nemesis','🕶️',92,55,430,2200],['World Government Ace','⚜️',115,68,520,3200],['Beasts Pirates Officer','🐉',145,82,680,5000],['Gatekeeper of the End','👑',190,105,900,10000]];
const items=[['Health Potion','🧪','Restore 60 HP','heal',60,120],['Attack Boost','⚔️','Permanent Attack +5','atk',5,500],['Defense Boost','🛡️','Permanent Defense +5','def',5,500],['Sea Chart','🧭','Navigation +8','nav',8,450]];
const skills=[['Armament Haki','arm','Attack +8','atk',8,1],['Observation Haki','obs','Dodge +5%','dodge',5,1],['Conqueror’s Haki','king','Attack +15','atk',15,3],['Ship Doctor Training','med','Max HP +40','maxHp',40,2]];
const factionNames={pirate:'🏴‍☠️ Pirates',marine:'⚓ Marines',revo:'🔥 Revolutionary Army',civilian:'🏝️ Civilians'};
function fresh(){return {lv:1,xp:0,berry:1200,bounty:0,island:0,chapter:0,hp:100,maxHp:100,atk:18,def:12,nav:10,crew:[0],active:0,team:[0],bond:{},skills:[],factions:{pirate:10,marine:0,revo:0,civilian:0},inventory:[],kills:0,bosses:0,flags:{},log:['<span class="good">Welcome to the Grand Line.</span>']}}
let S=load()||fresh();
function load(){try{return JSON.parse(localStorage.getItem('GL_FULL_EN'))}catch(e){return null}}
function save(manual){try{localStorage.setItem('GL_FULL_EN',JSON.stringify(S));if(manual)toast('Voyage saved')}catch(e){if(manual)toast('This browser is blocking saves, so progress will not be kept')}}
function resetGame(){openModal('Reset the game?','<div class="story">This erases your level, crew, Berries and story progress. It can’t be undone.</div><div class="actions"><button class="btn danger" onclick="doReset()">Erase everything</button></div>')}
function doReset(){try{localStorage.removeItem('GL_FULL_EN')}catch(e){}S=fresh();B=null;closeModal();render();toast('Progress reset')}
function toast(x){let e=document.createElement('div');e.textContent=x;e.style='position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#17304a;border:1px solid #5b7b98;padding:9px 14px;border-radius:10px;z-index:30;max-width:90vw';document.body.appendChild(e);setTimeout(()=>e.remove(),1600)}
function total(k){return S[k]+(S.skills.includes('arm')&&k==='atk'?8:0)+(S.skills.includes('king')&&k==='atk'?15:0)+(S.skills.includes('med')&&k==='maxHp'?40:0)}function xpNeed(){return 100+S.lv*75}function gainXP(n){S.xp+=n;while(S.xp>=xpNeed()){S.xp-=xpNeed();S.lv++;S.maxHp+=18;S.hp=S.maxHp;S.atk+=4;S.def+=3;S.nav+=2;S.bounty+=500;log('⭐ Level up! You are now Lv.'+S.lv,'good')}}
function log(x,c=''){S.log.unshift('<div class="'+c+'">'+x+'</div>');S.log=S.log.slice(0,70);document.getElementById('log').innerHTML=S.log.join('')}
function tab(id,el){['adventure','story','crew','growth','shop','faction'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tabs .btn').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function render(){document.getElementById('lv').textContent=S.lv;document.getElementById('berry').textContent=S.berry+' Berries';document.getElementById('bounty').textContent=S.bounty;document.getElementById('chapter').textContent=S.chapter+1;document.getElementById('place').textContent=islands[S.island][0];renderAdventure();renderStory();renderCrew();renderGrowth();renderShop();renderFaction();renderTeam();renderArea();renderBattle();document.getElementById('log').innerHTML=S.log.join('')}
function renderAdventure(){let a=document.getElementById('adventure');a.innerHTML='<h2>Captain’s Status</h2><div class="stats"><div class="card"><small>HP</small><b>'+S.hp+'/'+total('maxHp')+'</b><div class="bar"><i style="width:'+Math.max(0,S.hp/total('maxHp')*100)+'%"></i></div></div><div class="card"><small>Attack</small><b>'+total('atk')+'</b></div><div class="card"><small>Defense</small><b>'+total('def')+'</b></div><div class="card"><small>Navigation</small><b>'+total('nav')+'</b></div></div><p class="muted">XP '+S.xp+' / '+xpNeed()+'</p><h2>The Grand Line</h2><div class="map">'+islands.map((x,i)=>'<div class="island '+(S.lv<x[2]?'lock ':'')+(i===S.island?'sel':'')+'" onclick="travel('+i+')"><span>'+x[1]+' '+x[0]+'</span><strong>Lv.'+x[2]+'+</strong><small>Reward '+x[3]+'</small></div>').join('')+'</div>'}
function travel(i){if(S.lv<islands[i][2])return toast('Level too low. You need Lv.'+islands[i][2]);S.island=i;S.chapter=Math.max(S.chapter,i);log('⛵ Sailed to '+islands[i][0],'good');if(i===9&&S.lv>=25)openModal('Final Island','<div class="story">You have finally reached the end of the world. The true treasure and the truth are waiting for you.</div><div class="actions"><button class="btn primary" onclick="ending(\'freedom\')">Seek freedom</button><button class="btn" onclick="ending(\'truth\')">Reveal the truth</button><button class="btn" onclick="ending(\'king\')">Become King of the Sea</button></div>');render();save()}
function renderStory(){let c=chapters[S.chapter];document.getElementById('story').innerHTML='<h2>Chapter '+(S.chapter+1)+' · '+c[0]+'</h2><div class="story">'+c[2]+'</div><p>'+c[3]+'</p><div class="actions"><button class="btn primary" onclick="storyChoice(0)">Help the locals</button><button class="btn" onclick="storyChoice(1)">Chase the enemy</button><button class="btn" onclick="storyChoice(2)">Search for secrets</button></div><h3>Chapter Progress</h3>'+chapters.map((x,i)=>'<div class="row"><span>'+(i<=S.chapter?'✅':'🔒')+' '+(i+1)+'. '+x[0]+'</span><span class="muted">'+islands[i][0]+'</span></div>').join('')}
function storyChoice(n){let rewards=[{berry:350,pirate:5,civilian:8},{berry:600,marine:-3,pirate:8},{berry:250,revo:6}][n];S.berry+=rewards.berry;Object.keys(S.factions).forEach(k=>{if(rewards[k])S.factions[k]+=rewards[k]});gainXP(60+S.chapter*20);S.flags['chapter'+S.chapter+'choice']=n;log('📖 You made your choice in “'+chapters[S.chapter][0]+'”.','warn');if(S.chapter<9){S.chapter++;S.island=Math.max(S.island,S.chapter)}render();save()}
function renderCrew(){document.getElementById('crew').innerHTML='<h2>Crew &amp; Bonds</h2><p class="muted">Tap a crewmate to recruit them. Fighting together raises your bond.</p><div class="cards">'+chars.map((c,i)=>{let own=S.crew.includes(i);return '<div class="card click '+(S.active===i?'sel':'')+'" onclick="selectChar('+i+')"><div class="icon">'+c[1]+'</div><b>'+c[0]+'</b><div class="muted">'+c[2]+'</div><span class="tag">Attack '+c[3]+' · Defense '+c[4]+'</span><p>Skill: '+c[7]+'</p><small>'+(own?'Bond '+(S.bond[i]||0):'Not recruited · '+(300+i*350)+' Berries')+'</small></div>'}).join('')+'</div>'}
function selectChar(i){if(!S.crew.includes(i)){let cost=300+i*350;if(S.berry<cost)return toast('Not enough Berries');S.berry-=cost;S.crew.push(i);S.bond[i]=0;log('👒 '+chars[i][0]+' joined the crew!','good')}S.active=i;S.team=[i];render();save()}
function renderGrowth(){let learned=S.skills.map(k=>(skills.find(s=>s[1]===k)||[k])[0]);document.getElementById('growth').innerHTML='<h2>Skill Tree · Haki &amp; Growth</h2><div class="cards">'+skills.map(s=>'<div class="card"><b>'+s[0]+'</b><p class="muted">'+s[2]+'</p><span class="tag">Tier '+s[5]+'</span><div class="actions"><button class="btn '+(S.skills.includes(s[1])?'active':'primary')+'" '+(S.skills.includes(s[1])?'disabled':'')+' onclick="learn(\''+s[1]+'\')">'+(S.skills.includes(s[1])?'Learned':'Learn · '+(s[5]*600)+' Berries')+'</button></div></div>').join('')+'</div><h3>Learned</h3><p>'+(learned.length?learned.join(', '):'None yet')+'</p>'}
function learn(k){let s=skills.find(x=>x[1]===k);if(S.skills.includes(k))return;if(S.berry<s[5]*600)return toast('Not enough Berries');S.berry-=s[5]*600;S.skills.push(k);if(k==='med'){S.maxHp+=40;S.hp+=40}log('👁️ Learned: '+s[0],'good');render();save()}
function renderShop(){document.getElementById('shop').innerHTML='<h2>Sea Market</h2><div class="cards">'+items.map((it,i)=>'<div class="card"><div class="icon">'+it[1]+'</div><b>'+it[0]+'</b><p class="muted">'+it[2]+'</p><button class="btn primary" onclick="buy('+i+')">Buy · '+it[5]+'</button></div>').join('')+'</div>'}
function buy(i){let x=items[i];if(S.berry<x[5])return toast('Not enough Berries');S.berry-=x[5];if(x[3]==='heal')S.hp=Math.min(total('maxHp'),S.hp+x[4]);else S[x[3]]+=x[4];log('🛒 Bought '+x[0],'good');render();save()}
function renderFaction(){document.getElementById('faction').innerHTML='<h2>Faction Reputation</h2><p class="muted">Your story choices change your reputation and affect some events.</p>'+Object.keys(factionNames).map(k=>'<div class="row"><b>'+factionNames[k]+'</b><span>'+S.factions[k]+'</span></div>').join('')+'<div class="actions"><button class="btn" onclick="factionEvent()">Look for faction jobs</button></div>'}
function factionEvent(){let keys=Object.keys(S.factions),k=keys[Math.floor(Math.random()*keys.length)];S.factions[k]+=3;S.berry+=180;gainXP(40);log('⚓ Finished a small job for the '+factionNames[k].replace(/^\S+\s/,'')+'.','good');render();save()}
function renderTeam(){document.getElementById('team').innerHTML=S.team.map(i=>{let c=chars[i];return '<div class="card"><div class="icon">'+c[1]+'</div><b>'+c[0]+'</b><p>'+c[7]+'</p><span class="tag">Bond '+(S.bond[i]||0)+'</span></div>'}).join('')}
function renderArea(){let x=islands[S.island];document.getElementById('area').innerHTML='<div class="icon">'+x[1]+'</div><h3>'+x[0]+'</h3><p class="muted">Recommended Lv.'+x[2]+' · Reward '+x[3]+'</p><div class="actions"><button class="btn primary" onclick="explore()">🔭 Explore</button><button class="btn" onclick="encounter(false)">⚔️ Random battle</button><button class="btn" onclick="encounter(true)">👑 Boss</button></div>'}
let B=null;function renderBattle(){let e=document.getElementById('battle');if(!B)return e.innerHTML='<p class="muted">Not in a battle.</p>';e.innerHTML='<div class="card boss"><div class="row"><b>'+B.name+'</b><span>HP '+B.hp+'/'+B.max+'</span></div><div class="hp"><i style="width:'+Math.max(0,B.hp/B.max*100)+'%"></i></div><p>Attack '+B.atk+' · Defense '+B.def+'</p></div><div class="actions"><button class="btn primary" onclick="attack()">⚔️ Attack</button><button class="btn" onclick="skillAttack()">🔥 Skill</button><button class="btn" onclick="useItem()">🧪 Heal</button><button class="btn danger" onclick="flee()">Retreat</button></div>'}
function encounter(isBoss){if(B)return toast('You are already in a battle');if(isBoss&&S.lv<islands[S.island][2]+3)return toast('Bosses here need Lv.'+(islands[S.island][2]+3));let e;if(isBoss){let bi=Math.min(bosses.length-1,Math.floor(S.island/2));let x=bosses[bi];e={name:x[0],atk:x[2],def:x[3],hp:x[4],max:x[4],reward:x[5],boss:true}}else{let x=enemies[Math.min(enemies.length-1,Math.floor(S.lv/4)+Math.floor(Math.random()*2))];e={name:x[0],atk:x[1],def:x[2],hp:x[3],max:x[3],reward:x[4],boss:false}}B=e;log('⚔️ Encountered '+e.name+(e.boss?' (Boss)':''),'warn');renderBattle()}
function attack(){if(!B)return;let dmg=Math.max(1,total('atk')-B.def+Math.floor(Math.random()*10));B.hp-=dmg;log('⚔️ You dealt '+dmg+' damage.');enemyTurn();checkBattle()}
function skillAttack(){if(!B)return;let c=chars[S.active],dmg=Math.max(1,total('atk')*1.55-B.def+Math.floor(Math.random()*15));B.hp-=Math.floor(dmg);S.bounty+=B.boss?1500:100;log('🔥 '+c[0]+' used “'+c[7]+'” for '+Math.floor(dmg)+' damage.','good');enemyTurn();checkBattle()}
function enemyTurn(){if(!B||B.hp<=0)return;let dmg=Math.max(1,B.atk-total('def')+Math.floor(Math.random()*8));S.hp-=dmg;log('💥 '+B.name+' dealt '+dmg+' damage.','bad');if(S.hp<=0){S.hp=Math.ceil(total('maxHp')*.35);B=null;log('🏥 You were dragged back to the ship. HP restored to 35%.','warn')}}
function checkBattle(){if(B&&B.hp<=0){let r=B.reward;S.berry+=r;S.kills++;if(B.boss)S.bosses++;gainXP(B.boss?180:70);S.bounty+=B.boss?1200:150;S.bond[S.active]=(S.bond[S.active]||0)+1;log('🏆 Defeated '+B.name+' and earned '+r+' Berries!','good');B=null;save()}render()}
function useItem(){if(!B)return;S.hp=Math.min(total('maxHp'),S.hp+60);log('🧪 Used a Health Potion.','good');enemyTurn();checkBattle()}
function flee(){if(!B)return;B=null;log('🏃 You retreated from battle.','warn');render()}
function explore(){S.berry+=50+S.island*30;S.explore=(S.explore||0)+1;gainXP(35);let r=Math.random();if(r<.25){S.berry+=300;log('💎 Found a hidden treasure chest! +300 Berries.','good')}else if(r<.5){S.hp=Math.max(1,S.hp-15);log('🌪️ Hit dangerous waters and lost 15 HP.','bad')}else log('🔭 Explored '+islands[S.island][0]+' and found new clues.','good');render();save()}
function ending(type){S.flags.ending=type;S.bounty+=5000;let t={freedom:'a Free Voyager',truth:'the One Who Revealed the World’s Truth',king:'the New King of the Sea'}[type];openModal('Ending Reached','<div class="story">Congratulations! You conquered the Grand Line as '+t+'. Your legend will be sung across the seas.</div><p>Enemies defeated: '+S.kills+' · Bosses: '+S.bosses+' · Bounty: '+S.bounty+'</p>');log('🏁 Ending reached: '+t,'good');save()}
function openModal(t,b){document.getElementById('mt').textContent=t;document.getElementById('mb').innerHTML=b;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}render();
</script></body></html>
